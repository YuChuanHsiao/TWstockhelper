<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>存股小幫手 Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 引入 FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-200 font-sans p-4 md:p-6 min-h-screen transition-colors duration-300">
    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- 頂部標題與控制按鈕 -->
        <div class="flex flex-col md:flex-row justify-between items-center bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm dark:shadow-lg border dark:border-slate-700 transition-colors duration-300">
            <h1 class="text-2xl font-bold text-indigo-600 dark:text-cyan-400 mb-4 md:mb-0 tracking-wide"><i class="fa-solid fa-chart-line mr-2"></i>存股小幫手 Pro</h1>
            <div class="flex flex-wrap gap-3 items-center">
                <button onclick="toggleDarkMode()" class="px-4 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-lg text-sm transition-colors border dark:border-slate-600">
                    <i id="themeIcon" class="fa-solid fa-sun mr-1"></i><span id="themeText">亮色模式</span>
                </button>
                <button onclick="exportPNG()" class="px-4 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-lg text-sm transition-colors border dark:border-slate-600"><i class="fa-solid fa-image mr-1"></i>下載圖表</button>
                <button onclick="exportCSV()" class="px-4 py-2 bg-indigo-50 dark:bg-cyan-900/40 hover:bg-indigo-100 dark:hover:bg-cyan-800/60 text-indigo-700 dark:text-cyan-300 rounded-lg text-sm transition-colors border dark:border-indigo-100 dark:border-cyan-800"><i class="fa-solid fa-file-csv mr-1"></i>匯出 CSV</button>
            </div>
        </div>

        <!-- 黃金總結儀表板 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm dark:shadow-lg border dark:border-slate-700 border-l-4 border-blue-500 dark:border-l-cyan-500 transition-colors duration-300">
                <p class="text-sm text-slate-500 dark:text-slate-400 mb-1">最終總資產 (目標達成)</p>
                <h2 id="dashTotalAsset" class="text-3xl font-bold text-slate-800 dark:text-slate-100">0</h2>
                <p id="dashInflationNote" class="text-xs text-rose-500 dark:text-rose-400 mt-2 hidden"><i class="fa-solid fa-circle-info mr-1"></i>已折算 2% 通膨購買力</p>
            </div>
            <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm dark:shadow-lg border dark:border-slate-700 border-l-4 border-indigo-400 dark:border-l-indigo-500 transition-colors duration-300">
                <p class="text-sm text-slate-500 dark:text-slate-400 mb-1">總投入成本 (含加碼)</p>
                <h2 id="dashTotalCost" class="text-2xl font-bold text-slate-700 dark:text-slate-200">0</h2>
            </div>
            <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm dark:shadow-lg border dark:border-slate-700 border-l-4 border-emerald-400 dark:border-l-emerald-500 transition-colors duration-300">
                <p class="text-sm text-slate-500 dark:text-slate-400 mb-1">總投資淨利 (資本利得 + 配息)</p>
                <h2 id="dashTotalProfit" class="text-2xl font-bold text-emerald-600 dark:text-emerald-400">0</h2>
                <p id="dashTaxNote" class="text-xs text-rose-500 dark:text-rose-400 mt-2 hidden"><i class="fa-solid fa-circle-info mr-1"></i>已扣除二代健保補充保費</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- 左側控制面板 -->
            <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm dark:shadow-lg border dark:border-slate-700 space-y-5 lg:col-span-1 h-fit transition-colors duration-300">
                
                <!-- 標的快速選取與自訂新增區塊 -->
                <div class="space-y-3 bg-indigo-50/50 dark:bg-slate-900/50 p-4 rounded-xl border dark:border-slate-700">
                    <label class="block text-sm font-bold text-indigo-700 dark:text-cyan-400"><i class="fa-solid fa-wallet mr-1"></i>選擇或新增投資標的</label>
                    <select id="stockSelector" class="w-full p-2 bg-white dark:bg-slate-800 border dark:border-slate-600 rounded-lg text-sm text-slate-800 dark:text-slate-200 outline-none focus:ring-2 focus:ring-indigo-400 dark:focus:ring-cyan-500" onchange="applyStockPreset()">
                        <option value="custom">-- 手動自訂參數 --</option>
                        <option value="0050">0050 元大台灣50 (報酬6%, 殖利率3%)</option>
                        <option value="006208">006208 富邦台50 (報酬6%, 殖利率3%)</option>
                        <option value="00878">00878 國泰永續高股息 (報酬4%, 殖利率6%)</option>
                        <option value="00919">00919 群益台灣精選高息 (報酬3%, 殖利率8%)</option>
                        <option value="SP500">VOO / S&P 500 美股大盤 (報酬8%, 殖利率1.5%)</option>
                    </select>

                    <!-- 新增自訂股票的小表單 -->
                    <div class="pt-2 border-t dark:border-slate-700 space-y-2">
                        <p class="text-xs text-slate-500 dark:text-slate-400">將目前的參數儲存為新標的：</p>
                        <div class="flex gap-2">
                            <input type="text" id="customStockName" placeholder="輸入股票名稱 (例如 2330 台積電)" class="w-full p-1.5 bg-white dark:bg-slate-800 border dark:border-slate-600 rounded text-xs text-slate-800 dark:text-slate-200 outline-none">
                            <button onclick="saveCustomStock()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded text-xs transition-colors whitespace-nowrap"><i class="fa-solid fa-plus mr-1"></i>儲存</button>
                        </div>
                    </div>
                </div>

                <div class="space-y-4">
                    <h3 class="text-lg font-bold text-slate-700 dark:text-slate-200 border-b dark:border-slate-700 pb-2">基礎參數設定</h3>
                    
                    <div>
                        <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">初始本金 (元)</label>
                        <input type="number" id="inputInitial" class="w-full p-2 bg-white dark:bg-slate-900 border dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-indigo-400 dark:focus:ring-cyan-500 outline-none text-slate-800 dark:text-slate-100 transition-colors" value="100000" onchange="calculate()">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">每月定期定額 (元)</label>
                        <input type="number" id="inputMonthly" class="w-full p-2 bg-white dark:bg-slate-900 border dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-indigo-400 dark:focus:ring-cyan-500 outline-none text-slate-800 dark:text-slate-100 transition-colors" value="10000" onchange="calculate()">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">預期資本利得 (%)</label>
                            <input type="number" id="inputCapGain" step="0.1" class="w-full p-2 bg-white dark:bg-slate-900 border dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-indigo-400 dark:focus:ring-cyan-500 outline-none text-slate-800 dark:text-slate-100 transition-colors" value="5" onchange="calculate()">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1">預期殖利率 (%)</label>
                            <input type="number" id="inputDivYield" step="0.1" class="w-full p-2 bg-white dark:bg-slate-900 border dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-cyan-500 outline-none text-slate-800 dark:text-slate-100 transition-colors" value="4" onchange="calculate()">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-1 flex justify-between">
                            <span>投資年限: <span id="yearLabel" class="text-indigo-600 dark:text-cyan-400 font-bold">20</span> 年</span>
                        </label>
                        <input type="range" id="inputYears" min="5" max="40" value="20" class="w-full accent-indigo-600 dark:accent-cyan-500" oninput="document.getElementById('yearLabel').innerText=this.value; calculate()">
                    </div>
                </div>

                <div class="space-y-4 pt-2">
                    <h3 class="text-lg font-bold text-slate-700 dark:text-slate-200 border-b dark:border-slate-700 pb-2">進階策略與稅費</h3>
                    
                    <div class="flex items-center justify-between">
                        <label class="text-sm font-medium text-slate-600 dark:text-slate-400">股息處置</label>
                        <select id="inputDrip" class="p-1.5 bg-white dark:bg-slate-900 border dark:border-slate-600 rounded text-sm text-slate-800 dark:text-slate-200 outline-none" onchange="calculate()">
                            <option value="true">自動再投入 (DRIP)</option>
                            <option value="false">領出現金流</option>
                        </select>
                    </div>

                    <div class="flex items-center justify-between">
                        <label class="text-sm font-medium text-slate-600 dark:text-slate-400">扣除二代健保 (2.11%)</label>
                        <input type="checkbox" id="inputNHI" class="w-4 h-4 accent-rose-500 rounded bg-white dark:bg-slate-900 border-slate-300 dark:border-slate-600" onchange="calculate()">
                    </div>

                    <div class="flex items-center justify-between">
                        <label class="text-sm font-medium text-slate-600 dark:text-slate-400">折算通膨購買力 (2%)</label>
                        <input type="checkbox" id="inputInflation" class="w-4 h-4 accent-rose-500 rounded bg-white dark:bg-slate-900 border-slate-300 dark:border-slate-600" onchange="calculate()">
                    </div>
                </div>

                <div class="space-y-3 pt-2">
                    <div class="flex justify-between items-center border-b dark:border-slate-700 pb-2">
                        <h3 class="text-lg font-bold text-slate-700 dark:text-slate-200">不定期大額加碼</h3>
                        <button onclick="addExtraRow()" class="text-indigo-600 dark:text-cyan-400 text-sm hover:underline"><i class="fa-solid fa-plus"></i> 新增</button>
                    </div>
                    <div id="extraContainer" class="space-y-2 max-h-32 overflow-y-auto pr-1">
                        <!-- 動態加碼列表 -->
                    </div>
                </div>

            </div>

            <!-- 右側圖表區塊 -->
            <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm dark:shadow-lg border dark:border-slate-700 lg:col-span-2 flex flex-col transition-colors duration-300">
                <div class="relative w-full flex-grow" style="height: 450px;">
                    <canvas id="myChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 預設標的庫與自訂標的資料庫
        let stockPresets = {
            "0050": { name: "0050 元大台灣50", capGain: 6.0, divYield: 3.0 },
            "006208": { name: "006208 富邦台50", capGain: 6.0, divYield: 3.0 },
            "00878": { name: "00878 國泰永續高股息", capGain: 4.0, divYield: 6.0 },
            "00919": { name: "00919 群益台灣精選高息", capGain: 3.0, divYield: 8.0 },
            "SP500": { name: "VOO / S&P 500 美股大盤", capGain: 8.0, divYield: 1.5 }
        };

        let currentChartData = {}; 
        let extraInvestments = []; 

        window.onload = () => {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
                updateThemeButtonUI('light');
            } else {
                document.documentElement.classList.add('dark');
                updateThemeButtonUI('dark');
            }

            loadCustomStocks(); // 載入使用者的自訂股票
            loadData();
            renderExtraRows();
            calculate();
        };

        // 載入 localStorage 中的自訂股票並更新下拉選單
        function loadCustomStocks() {
            const savedCustom = localStorage.getItem('customStockPresets');
            if (savedCustom) {
                const customObj = JSON.parse(savedCustom);
                stockPresets = { ...stockPresets, ...customObj };
            }
            updateStockSelectorUI();
        }

        // 更新下拉選單的 HTML 選項
        function updateStockSelectorUI(selectedKey = 'custom') {
            const selector = document.getElementById('stockSelector');
            selector.innerHTML = `<option value="custom">-- 手動自訂參數 --</option>`;
            
            for (const [key, item] of Object.entries(stockPresets)) {
                selector.innerHTML += `<option value="${key}">${item.name} (報酬${item.capGain}%, 殖利率${item.divYield}%)</option>`;
            }
            selector.value = selectedKey;
        }

        // 儲存使用者輸入的新股票
        function saveCustomStock() {
            const nameInput = document.getElementById('customStockName').value.trim();
            if (!nameInput) {
                alert('請輸入股票名稱！');
                return;
            }
            const capGain = Number(document.getElementById('inputCapGain').value);
            const divYield = Number(document.getElementById('inputDivYield').value);
            
            const customKey = 'custom_' + Date.now();
            stockPresets[customKey] = { name: nameInput, capGain, divYield };

            // 儲存至 localStorage
            let userCustoms = JSON.parse(localStorage.getItem('customStockPresets') || '{}');
            userCustoms[customKey] = stockPresets[customKey];
            localStorage.setItem('customStockPresets', JSON.stringify(userCustoms));

            updateStockSelectorUI(customKey);
            document.getElementById('customStockName').value = '';
            alert(`成功將「${nameInput}」加入自選股選單！`);
        }

        // 套用標的預設值
        function applyStockPreset() {
            const selected = document.getElementById('stockSelector').value;
            if (selected !== 'custom' && stockPresets[selected]) {
                document.getElementById('inputCapGain').value = stockPresets[selected].capGain;
                document.getElementById('inputDivYield').value = stockPresets[selected].divYield;
            }
            calculate();
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            const theme = isDark ? 'dark' : 'light';
            localStorage.setItem('theme', theme);
            updateThemeButtonUI(theme);
            calculate();
        }

        function updateThemeButtonUI(theme) {
            const icon = document.getElementById('themeIcon');
            const text = document.getElementById('themeText');
            if (theme === 'dark') {
                icon.className = "fa-solid fa-sun mr-1";
                text.innerText = "亮色模式";
            } else {
                icon.className = "fa-solid fa-moon mr-1";
                text.innerText = "暗色模式";
            }
        }

        function addExtraRow(year = 5, amount = 100000) {
            extraInvestments.push({ year, amount });
            renderExtraRows();
            calculate();
        }

        function removeExtraRow(index) {
            extraInvestments.splice(index, 1);
            renderExtraRows();
            calculate();
        }

        function updateExtra(index, field, value) {
            extraInvestments[index][field] = Number(value);
            calculate();
        }

        function renderExtraRows() {
            const container = document.getElementById('extraContainer');
            container.innerHTML = '';
            if(extraInvestments.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400 dark:text-slate-500 text-center py-2">無加碼計畫</p>';
                return;
            }
            extraInvestments.forEach((item, index) => {
                container.innerHTML += `
                    <div class="flex gap-2 items-center bg-slate-50 dark:bg-slate-900 p-2 rounded border dark:border-slate-700">
                        <span class="text-sm text-slate-600 dark:text-slate-400">第</span>
                        <input type="number" min="1" max="40" class="w-16 p-1 bg-white dark:bg-slate-800 border dark:border-slate-600 rounded text-sm text-center text-slate-800 dark:text-slate-200 outline-none" value="${item.year}" onchange="updateExtra(${index}, 'year', this.value)">
                        <span class="text-sm text-slate-600 dark:text-slate-400">年加碼</span>
                        <input type="number" class="w-24 p-1 bg-white dark:bg-slate-800 border dark:border-slate-600 rounded text-sm text-right flex-grow text-slate-800 dark:text-slate-200 outline-none" value="${item.amount}" onchange="updateExtra(${index}, 'amount', this.value)">
                        <button onclick="removeExtraRow(${index})" class="text-rose-500 hover:text-rose-700 px-2 transition-colors"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
            });
        }

        function formatCurrency(num) {
            return new Intl.NumberFormat('zh-TW', { style: 'currency', currency: 'TWD', maximumFractionDigits: 0 }).format(num);
        }

        function calculate() {
            saveData(); 

            const initial = Number(document.getElementById('inputInitial').value);
            const monthly = Number(document.getElementById('inputMonthly').value);
            const capGain = Number(document.getElementById('inputCapGain').value) / 100;
            const divYield = Number(document.getElementById('inputDivYield').value) / 100;
            const years = Number(document.getElementById('inputYears').value);
            const drip = document.getElementById('inputDrip').value === 'true';
            const nhiTax = document.getElementById('inputNHI').checked;
            const inflation = document.getElementById('inputInflation').checked;

            let labels = [];
            let principalData = [];
            let capGainData = [];
            let divData = [];
            
            let currentPrincipal = initial;
            let totalInvested = initial; 
            let currentCapGain = 0;
            let currentDividend = 0;

            document.getElementById('dashInflationNote').style.display = inflation ? 'block' : 'none';
            document.getElementById('dashTaxNote').style.display = nhiTax ? 'block' : 'none';

            for (let i = 1; i <= years; i++) {
                labels.push(`第 ${i} 年`);

                let yearlyExtra = extraInvestments.filter(e => e.year === i).reduce((sum, e) => sum + e.amount, 0);
                if (yearlyExtra > 0) {
                    currentPrincipal += yearlyExtra;
                    totalInvested += yearlyExtra;
                }

                currentPrincipal += (monthly * 12);
                totalInvested += (monthly * 12);

                let rawDiv = currentPrincipal * divYield;
                let actualDiv = rawDiv;
                
                if (nhiTax && rawDiv >= 20000) {
                    actualDiv = rawDiv * (1 - 0.0211);
                }

                if (drip) {
                    currentPrincipal += actualDiv;
                } else {
                    currentDividend += actualDiv;
                }

                let yearlyGain = currentPrincipal * capGain;
                currentCapGain += yearlyGain;
                currentPrincipal += yearlyGain;

                let discountRate = inflation ? Math.pow(1.02, i) : 1;

                principalData.push(Math.round(totalInvested / discountRate));
                capGainData.push(Math.round(currentCapGain / discountRate));
                divData.push(Math.round(currentDividend / discountRate));
            }

            let finalAsset = (drip ? currentPrincipal : currentPrincipal + currentDividend);
            let finalDiscount = inflation ? Math.pow(1.02, years) : 1;
            
            document.getElementById('dashTotalAsset').innerText = formatCurrency(finalAsset / finalDiscount);
            document.getElementById('dashTotalCost').innerText = formatCurrency(totalInvested);
            document.getElementById('dashTotalProfit').innerText = formatCurrency((finalAsset - totalInvested) / finalDiscount);

            currentChartData = { labels, principalData, capGainData, divData };
            drawChart(labels, principalData, capGainData, divData, drip);
        }

        function drawChart(labels, principal, capGain, dividend, drip) {
            const ctx = document.getElementById('myChart').getContext('2d');
            
            if (window.myChartInstance) {
                window.myChartInstance.destroy();
            }

            const isDark = document.documentElement.classList.contains('dark');

            window.myChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '累積投入本金',
                            data: principal,
                            backgroundColor: isDark ? '#4f46e5' : '#6366f1', 
                            stack: 'Stack 0',
                        },
                        {
                            label: '資本利得增值',
                            data: capGain,
                            backgroundColor: isDark ? '#0ea5e9' : '#38bdf8', 
                            stack: 'Stack 0',
                        },
                        {
                            label: drip ? '累積配息 (已再投入)' : '累積已領取配息',
                            data: dividend,
                            backgroundColor: isDark ? '#10b981' : '#34d399', 
                            stack: drip ? 'Stack 0' : 'Stack 1',
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    plugins: {
                        tooltip: {
                            backgroundColor: isDark ? 'rgba(15, 23, 42, 0.9)' : 'rgba(255, 255, 255, 0.9)',
                            titleColor: isDark ? '#e2e8f0' : '#1e293b',
                            bodyColor: isDark ? '#cbd5e1' : '#475569',
                            borderColor: isDark ? '#334155' : '#cbd5e1',
                            borderWidth: 1,
                            callbacks: {
                                label: function(context) {
                                    return context.dataset.label + ': ' + formatCurrency(context.raw);
                                }
                            }
                        },
                        legend: {
                            labels: {
                                color: isDark ? '#cbd5e1' : '#475569'
                            }
                        }
                    },
                    scales: {
                        x: { 
                            stacked: true,
                            grid: { color: isDark ? '#334155' : '#f1f5f9' },
                            ticks: { color: isDark ? '#94a3b8' : '#64748b' }
                        },
                        y: { 
                            stacked: true,
                            grid: { color: isDark ? '#334155' : '#f1f5f9' },
                            ticks: { color: isDark ? '#94a3b8' : '#64748b' }
                        }
                    }
                }
            });
        }

        function saveData() {
            const data = {
                stockSelector: document.getElementById('stockSelector').value,
                initial: document.getElementById('inputInitial').value,
                monthly: document.getElementById('inputMonthly').value,
                capGain: document.getElementById('inputCapGain').value,
                divYield: document.getElementById('inputDivYield').value,
                years: document.getElementById('inputYears').value,
                drip: document.getElementById('inputDrip').value,
                nhi: document.getElementById('inputNHI').checked,
                inflation: document.getElementById('inputInflation').checked,
                extra: extraInvestments
            };
            localStorage.setItem('stockHelperState_v5', JSON.stringify(data));
        }

        function loadData() {
            const saved = localStorage.getItem('stockHelperState_v5') || localStorage.getItem('stockHelperState_v4');
            if (saved) {
                const data = JSON.parse(saved);
                if(data.stockSelector) {
                    const selector = document.getElementById('stockSelector');
                    if(selector.querySelector(`option[value="${data.stockSelector}"]`)) {
                        selector.value = data.stockSelector;
                    }
                }
                document.getElementById('inputInitial').value = data.initial;
                document.getElementById('inputMonthly').value = data.monthly;
                document.getElementById('inputCapGain').value = data.capGain;
                document.getElementById('inputDivYield').value = data.divYield;
                document.getElementById('inputYears').value = data.years;
                document.getElementById('yearLabel').innerText = data.years;
                document.getElementById('inputDrip').value = data.drip;
                document.getElementById('inputNHI').checked = data.nhi;
                document.getElementById('inputInflation').checked = data.inflation;
                extraInvestments = data.extra || [];
            }
        }

        function exportPNG() {
            const canvas = document.getElementById('myChart');
            const ctx = canvas.getContext('2d');
            ctx.save();
            ctx.globalCompositeOperation = 'destination-over';
            const isDark = document.documentElement.classList.contains('dark');
            ctx.fillStyle = isDark ? '#1e293b' : '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const a = document.createElement('a');
            a.href = canvas.toDataURL('image/png');
            a.download = '存股資產成長圖表.png';
            a.click();
            
            ctx.restore();
            calculate();
        }

        function exportCSV() {
            let csvContent = "\uFEFF年份,累積投入本金,資本利得增值,累積配息,當年度總資產\n";
            for (let i = 0; i < currentChartData.labels.length; i++) {
                let p = currentChartData.principalData[i];
                let c = currentChartData.capGainData[i];
                let d = currentChartData.divData[i];
                let total = p + c + d;
                csvContent += `${currentChartData.labels[i]},${p},${c},${d},${total}\n`;
            }
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '存股試算報表.csv';
            a.click();
        }
    </script>
</body>
</html>
